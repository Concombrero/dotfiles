[colors]
background = #F0fdf6e3
background-alt = ${colors.surface1}
foreground = ${colors.text}
primary = ${colors.blue}
secondary = ${colors.mantle}
alert = ${colors.red}
disabled = ${colors.subtext1}

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 36pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

bottom = false

line-size = 2pt

#border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.yellow}

font-0 = "JetBrainsMono Nerd Font:size=12;3"
font-1 = "Symbols Nerd Font Mono:size=14;3"
; for audio icons which i find too big
font-2 ="Symbols Nerd Font Mono:size=11;3" 
;for memory icon which is not available in symbols font for some reason
font-3 = "RobotoMono Nerd Font Mono:size=23;6"

modules-left = xworkspaces xwindow
modules-right = pulseaudio battery memory eth wlan date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.base}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#b58900}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

; --- Volume State (Active) ---
; Replaced "VOL" prefix with <ramp-volume>
format-volume = <ramp-volume> <label-volume>

; Define speaker icons (Low -> Mid -> High)
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

; Color the icons to match your theme (Primary color)
ramp-volume-foreground = ${colors.primary}
ramp-volume-font = 3

label-volume = %percentage%%

; --- Muted State ---
; This adds the "X" speaker icon before the "muted" text
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.disabled}
format-muted-prefix-font = 3

label-muted = muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{A1:kitty btop &:} "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 3
label = %gb_used%%{A}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
label = %percentage:2%%

[module/battery]
type = internal/battery
format-prefix = "BAT "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
full-at = 99
format-charging = %{A1:gnome-control-center power &:}<animation-charging> <label-charging>%{A}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750
animation-charging-foreground = ${colors.teal}
animation-charging-font = 2
format-discharging = %{A1:gnome-control-center power &:}<ramp-capacity> <label-discharging>%{A}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-font = 2

format-full = %{A1:gnome-control-center power &:}<label-full>%{A}
format-full-prefix = " "
format-full-prefix-foreground = ${colors.primary}
format-full-prefix-font = 2

low-at = 15
; Hardware names vary across machines; launch_polybar.sh exports these when available.
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:ADP1}
poll-interval = 5

[network-base]
type = internal/network
interval = 5
format-disconnected =
label-disconnected = %{F#b58900}%ifname%%{F#93a1a1} disconnected

[module/wlan]
inherit = network-base
interface = ${env:POLYBAR_WLAN_INTERFACE:wlo1}
format-connected = %{A1:gnome-control-center wifi&:}<ramp-signal> <label-connected>%{A}
label-connected = %essid%

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-5 = 󰤨
ramp-signal-foreground = ${colors.primary}
ramp-signal-font = 2

[module/eth]
type = custom/script
exec = ~/.local/bin/polybar-ethernet-label
interval = 5
format = %{A1:nm-connection-editor &:}<label>%{A}
format-prefix = "󰈀 "
format-prefix-foreground = ${colors.primary}
label = %output%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
