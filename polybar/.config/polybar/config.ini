surface1 = #eee8d5
surface2 = #e1dac7
overlay0 = #d2c9b2
overlay1 = #93a1a1
overlay2 = #839496
blue = #268bd2
lavender = #6c71c4
sapphire = #268bd2
sky = #2aa198
teal = #2aa198
green = #859900
yellow = #b58900
peach = #cb4b16
maroon = #cb4b16
red = #dc322f
mauve = #6c71c4
pink = #d33682
flamingo = #d33682
rosewater = #fdf6e3
