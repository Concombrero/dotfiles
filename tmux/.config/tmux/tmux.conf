# Easy config reload
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf sourced!"

# Send prefix
set -g prefix M-Tab 
bind M-Tab send-prefix

# tmux may be started by systemd or a login shell before fish config runs.
# Keep new panes on the workstation's interactive shell regardless of that parent.
set -g default-shell /usr/bin/fish

# Windows
bind-key q kill-window
bind-key v split-window
bind-key Enter new-window
bind-key s command-prompt -p "swap-window with:" "swap-window -t '%%'"

# Mouse mode
setw -g mouse on

# Fast toggle (normally prefix-l)
bind-key Tab last-window

# FR AZERTY: select windows with number row without Shift
bind-key -T prefix "&" select-window -t 1
bind-key -T prefix "é" select-window -t 2
bind-key -T prefix "\"" select-window -t 3
bind-key -T prefix "'" select-window -t 4
bind-key -T prefix "(" select-window -t 5
bind-key -T prefix "-" select-window -t 6
bind-key -T prefix "è" select-window -t 7
bind-key -T prefix "_" select-window -t 8
bind-key -T prefix "ç" select-window -t 9
bind-key -T prefix "à" select-window -t 10
# Vim pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Automatically renumber window numbers on closing a pane
set -g renumber-windows on

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Don't wait for an escape sequence after seeing C-a
set -s escape-time 0

# Focus events for auto-read to work
set -g focus-events on

# Clipboard: forward OSC 52 sequences to the outer terminal
# so programs inside tmux can access the system clipboard directly
set -s set-clipboard on

# Allow escape sequences (images, OSC) to pass through to the terminal
set -g allow-passthrough on

# Keep TERM metadata from the attached client so image-capable tools such as
# yazi can detect kitty correctly inside tmux.
# Keep GUI/session vars current when attaching existing tmux sessions.
# Include I3SOCK so i3-msg works from tmux panes after reattach.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS XDG_SESSION_TYPE XDG_CURRENT_DESKTOP I3SOCK PATH TERM TERM_PROGRAM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID"

# Seed tmux env from systemd --user activation environment (set by i3 on login).
# Avoid guessing DISPLAY from /tmp/.X11-unix because :0 is often GDM, not the user session.
run-shell 'if command -v systemctl >/dev/null 2>&1; then systemctl --user show-environment 2>/dev/null | while IFS="=" read -r key value; do case "$key" in DISPLAY|XAUTHORITY|XDG_RUNTIME_DIR|DBUS_SESSION_BUS_ADDRESS|XDG_SESSION_TYPE|XDG_CURRENT_DESKTOP|I3SOCK) [ -n "$value" ] || continue; tmux set-environment -g "$key" "$value"; for s in $(tmux list-sessions -F "#S" 2>/dev/null); do tmux set-environment -t "$s" "$key" "$value"; done ;; esac; done; fi'
# Keep resurrect state in the XDG directory that already holds the real saves.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Do not let continuum replace `last` with a bootstrap-only `0` session save.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/repair-resurrect-last'

# Terminal setup
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-kitty:Tc,xterm-256color:Tc"

# Solarized Light theme
set -g @sol_base3 "#fdf6e3"
set -g @sol_base2 "#eee8d5"
set -g @sol_base1 "#93a1a1"
set -g @sol_base01 "#586e75"
set -g @sol_blue "#268bd2"
set -g @sol_cyan "#2aa198"
set -g @sol_red "#dc322f"
set -g @sol_violet "#6c71c4"
set -g @sol_yellow "#b58900"
set -g @sol_window_text " #I #{=/30/...:#{?#{m/r:^(fish|zsh|bash|sh|dash|ksh|mksh|ash|nu|xonsh|pwsh|powershell)$,#{pane_current_command}},#{pane_title},#{?#{m/r:^(~/|/),#{pane_title}},#{pane_current_command},#{?#{m/r:^[^ ]+ (~/|/),#{pane_title}},#{s| .*||:pane_title},#{pane_title}}}}} "
set -g @sol_window_current_text " #I #{=/30/...:#{?#{m/r:^(fish|zsh|bash|sh|dash|ksh|mksh|ash|nu|xonsh|pwsh|powershell)$,#{pane_current_command}},#{pane_title},#{?#{m/r:^(~/|/),#{pane_title}},#{pane_current_command},#{?#{m/r:^[^ ]+ (~/|/),#{pane_title}},#{s| .*||:pane_title},#{pane_title}}}}} "
set -g mode-style "fg=#{@sol_base3},bg=#{@sol_cyan},bold"
set -g message-style "fg=#{@sol_base3},bg=#{@sol_blue},align=centre"
set -g message-command-style "fg=#{@sol_base3},bg=#{@sol_blue},align=centre"
set -g pane-border-style "fg=#{@sol_base1}"
set -g pane-active-border-style "fg=#{?pane_in_mode,#{@sol_violet},#{?pane_synchronized,#{@sol_cyan},#{@sol_blue}}}"
set -g popup-style "fg=#{@sol_base01},bg=#{@sol_base3}"
set -g popup-border-style "fg=#{@sol_base1}"

# Status line
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=default,fg=#{@sol_base01}"
set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=#{@sol_base3},bg=#{@sol_red},bold],#[fg=#{@sol_base3},bg=#{@sol_blue},bold]}  #S #[default]"
set -g window-status-style "fg=#{@sol_base01},bg=#{@sol_base2}"
set -g window-status-current-style "fg=#{@sol_base3},bg=#{@sol_violet},bold"
set -g window-status-activity-style "fg=#{@sol_base3},bg=#{@sol_cyan},bold"
set -g window-status-bell-style "fg=#{@sol_base3},bg=#{@sol_yellow},bold"
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@sol_base01},bg=#{@sol_base2}]#{E:@sol_window_text}"
set -g window-status-current-format "#[fg=#{@sol_base3},bg=#{@sol_violet},bold]#{E:@sol_window_current_text}"
# Tmux hardcodes < and > as the default window-list trim markers inside the
# built-in status-format[0] string. Replace just those markers to keep the rest
# of tmux's default window-list behavior intact.
run-shell 'fmt=$(tmux show -gv status-format[0] | perl -pe "s/\\#\\[list=left-marker\\]</#[list=left-marker]|/; s/\\#\\[list=right-marker\\]>/#[list=right-marker]|/"); tmux set -g status-format[0] "$fmt"'

# TPM plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence (resurrect)
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes 'lazygit btop '
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Initialize TPM (keep this at the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
