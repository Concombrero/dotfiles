# vim:ft=kitty

## name:     Solarized Light
## author:   Ethan Schoonover, adapted for Kitty
## license:  MIT
## blurb:    Precision colors for bright workspaces.

# The basic colors
foreground              #000000
background              #fdf6e3
selection_foreground    #000000
selection_background    #eee8d5

# Cursor colors
cursor                  #000000
cursor_text_color       #fdf6e3

# Scrollbar colors
scrollbar_handle_color  #93a1a1
scrollbar_track_color   #eee8d5

# URL color when hovering with mouse
url_color               #268bd2

# Kitty window border colors
active_border_color     #268bd2
inactive_border_color   #93a1a1
bell_border_color       #cb4b16

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #fdf6e3
active_tab_background   #268bd2
inactive_tab_foreground #586e75
inactive_tab_background #eee8d5
tab_bar_background      #fdf6e3

# Colors for marks (marked text in the terminal)
mark1_foreground #fdf6e3
mark1_background #268bd2
mark2_foreground #fdf6e3
mark2_background #6c71c4
mark3_foreground #fdf6e3
mark3_background #2aa198

# The 16 terminal colors

# black
color0 #073642
color8 #002b36

# red
color1 #dc322f
color9 #cb4b16

# green
color2 #859900
color10 #586e75

# yellow
color3 #b58900
color11 #657b83

# blue
color4 #268bd2
color12 #839496

# magenta
color5 #d33682
color13 #6c71c4

# cyan
color6 #2aa198
color14 #93a1a1

# white
color7 #eee8d5
color15 #fdf6e3