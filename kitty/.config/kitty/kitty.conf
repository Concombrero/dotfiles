# Solarized Light theme vendored under ~/.config/kitty/themes/.
include themes/solarized-light.conf

font_family JetBrainsMono Nerd Font Mono
font_size 11.2
bold_font auto
italic_font auto
bold_italic_font auto

repaint_delay 10
input_delay 3
sync_to_monitor yes

remember_window_size yes
initial_window_width 960
initial_window_height 1052

shell /usr/bin/fish
shell_integration enabled
# Allow kitty-scrollback.nvim to use remote control without enabling TTY requests.
allow_remote_control socket-only
# Keep the socket in the runtime dir and make each kitty instance unique.
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
editor nvim

# Browse kitty scrollback and recent command output in Neovim.
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

scrollback_lines 5000

touch_scroll_multiplier 0.5
pixel_scroll yes
momentum_scroll 0.7

background_opacity 0.94
dynamic_background_opacity yes

# JetBrains Mono Nerd Font Mono renders many Nerd Font glyphs smaller than
# Roboto Mono Propo on this setup. Route the common icon ranges to the Propo
# face so UI icons read larger, while keeping Typst on the same known-good
# family and codepoint.
symbol_map U+E000-U+F8FF,U+F0001-U+F1FFF RobotoMono Nerd Font Propo

# Keep kitty's text compositing close to its Linux baseline. More aggressive
# contrast tuning made glyph edges look jagged on this setup.
text_composition_strategy 1.0 0

copy_on_select clipboard
clipboard_control write-clipboard write-primary no-append

hide_window_decorations yes
window_padding_width 0
confirm_os_window_close 0
enable_audio_bell no

tab_bar_min_tabs 2
tab_bar_margin_width 4
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}"

map ctrl+space>c new_tab
map ctrl+space>k close_tab
map ctrl+space>n next_tab
map ctrl+space>p previous_tab

map ctrl+shift+equal change_font_size current +2.0
map ctrl+shift+plus change_font_size current +2.0
map ctrl+shift+minus change_font_size current -2.0
map ctrl+shift+kp_subtract change_font_size current -2.0
